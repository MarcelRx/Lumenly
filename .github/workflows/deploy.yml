name: Deploy Lumenly

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumenly-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backup-validation:
    name: Backup Validation
    runs-on: ubuntu-latest
    needs: [build-and-push]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate backup scripts
        run: |
          if [ -f "backups/backup_postgres.sh" ]; then
            echo "PostgreSQL backup script exists"
            chmod +x backups/backup_postgres.sh
          else
            echo "Warning: PostgreSQL backup script not found"
          fi
          
          if [ -f "backups/backup_mongo.sh" ]; then
            echo "MongoDB backup script exists"
            chmod +x backups/backup_mongo.sh
          else
            echo "Warning: MongoDB backup script not found"
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backup-validation]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploy to staging would run here"
          echo "This step requires staging environment configuration"
          echo "Current state: Manual deployment via Docker Compose"
      
      - name: Health verification
        run: |
          echo "Health verification would run here"
          echo "This requires staging environment to be available"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://lumenly.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: senior-engineer,cto
          minimum-approvals: 1
      
      - name: Deploy to production
        run: |
          echo "Deploy to production would run here"
          echo "This step requires production environment configuration"
          echo "Current state: Manual deployment via Docker Compose"
      
      - name: Health verification
        run: |
          echo "Health verification would run here"
          echo "This requires production environment to be available"
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rollback would run here"
          echo "This requires rollback automation to be configured"