name: CI Lumenly

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumenly-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lumenly
          POSTGRES_PASSWORD: lumenly_secure_password_32chars
          POSTGRES_DB: lumenly_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Verify service connectivity
        run: |
          cd apps/backend
          python -c "
          import asyncio
          import sys

          async def check_postgres():
              from sqlalchemy.ext.asyncio import create_async_engine
              from sqlalchemy import text
              engine = create_async_engine('postgresql+asyncpg://lumenly:lumenly_secure_password_32chars@localhost:5433/lumenly_test')
              try:
                  async with engine.begin() as conn:
                      await conn.execute(text('SELECT 1'))
                  print('✓ PostgreSQL connection successful')
                  await engine.dispose()
              except Exception as e:
                  print(f'✗ PostgreSQL connection failed: {e}')
                  sys.exit(1)

          async def check_mongodb():
              from motor.motor_asyncio import AsyncIOMotorClient
              client = AsyncIOMotorClient('mongodb://localhost:27017')
              try:
                  await client.admin.command('ping')
                  print('✓ MongoDB connection successful')
                  client.close()
              except Exception as e:
                  print(f'✗ MongoDB connection failed: {e}')
                  sys.exit(1)

          async def check_redis():
              import redis.asyncio as redis
              client = redis.from_url('redis://localhost:6379/1')
              try:
                  await client.ping()
                  print('✓ Redis connection successful')
                  await client.close()
              except Exception as e:
                  print(f'✗ Redis connection failed: {e}')
                  sys.exit(1)

          async def check_qdrant():
              from httpx import AsyncClient
              async with AsyncClient() as client:
                  try:
                      response = await client.get('http://localhost:6333/health')
                      if response.status_code == 200:
                          print('✓ Qdrant connection successful')
                      else:
                          print(f'✗ Qdrant health check failed: {response.status_code}')
                          sys.exit(1)
                  except Exception as e:
                      print(f'✗ Qdrant connection failed: {e}')
                      sys.exit(1)

          async def main():
              await check_postgres()
              await check_mongodb()
              await check_redis()
              await check_qdrant()
              print('All services are healthy')

          asyncio.run(main())
          "

      - name: Run tests
        run: |
          cd apps/backend
          python -m pytest tests/ -v --tb=short --no-header
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-testing-32bytes-min
          JWT_SECRET: test-jwt-secret-for-testing-32bytes-min
          JWT_SECRET_RS256_PRIVATE: test-rs256-private-key-for-testing-32bytes-min
          JWT_SECRET_RS256_PUBLIC: test-rs256-public-key-for-testing-32bytes-min
          POSTGRES_URL: postgresql+asyncpg://lumenly:lumenly_secure_password_32chars@localhost:5433/lumenly_test
          MONGODB_URL: mongodb://localhost:27017/lumenly_test
          REDIS_URL: redis://localhost:6379/1
          QDRANT_URL: http://localhost:6333
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          COHERE_API_KEY: ""
          ELEVENLABS_API_KEY: ""

      - name: Run tests with coverage
        run: |
          cd apps/backend
          python -m pytest tests/ --cov=app --cov-report=xml --cov-report=term

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt
          pip install ruff==0.15.14

      - name: Run ruff linter with auto-fix
        run: |
          cd apps/backend
          ruff check app/ --fix

      - name: Run ruff formatter
        run: |
          cd apps/backend
          ruff format app/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} python -c "import app; print('Import successful')"
