name: CI Lumenly

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumenly-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          cd apps/backend
          python -m pytest tests/ -v --tb=short --no-header
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-testing-32bytes-min
          JWT_SECRET: test-jwt-secret-for-testing-32bytes-min
          JWT_SECRET_RS256_PRIVATE: test-rs256-private-key-for-testing-32bytes-min
          JWT_SECRET_RS256_PUBLIC: test-rs256-public-key-for-testing-32bytes-min
          POSTGRES_URL: postgresql+asyncpg://lumenly:lumenly_secure_password_32chars@localhost:5433/lumenly_test
          MONGODB_URL: mongodb://localhost:27017/lumenly_test
          REDIS_URL: redis://localhost:6379/1
          QDRANT_URL: http://localhost:6333
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          COHERE_API_KEY: ""

      - name: Run tests with coverage
        run: |
          cd apps/backend
          python -m pytest tests/ --cov=app --cov-report=xml --cov-report=term

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff linter
        run: |
          cd apps/backend
          ruff check app/

      - name: Run ruff formatter check
        run: |
          cd apps/backend
          ruff format --check app/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} python -c "import app; print('Import successful')"
