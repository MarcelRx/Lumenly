[project]
name = "lumenly-backend"
version = "0.0.0"
description = "Lumenly FastAPI backend service"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "prometheus-client>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
