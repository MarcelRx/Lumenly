# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Inhibit dependency alerts when backend is down
  - source_match:
      alertname: "BackendDown"
    target_match_re:
      alertname: "(PostgreSQLUnavailable|MongoDBUnavailable|RedisUnavailable|QdrantUnavailable)"
      severity: "(P0|P1)"
    equal: ["instance"]

  # Inhibit high latency alerts when backend is down
  - source_match:
      alertname: "BackendDown"
    target_match_re:
      alertname: "(HighHTTPLatencyP95|HighHTTPLatencyP99|ElevatedHTTPLatencyP95)"
    equal: ["instance"]

  # Inhibit Celery alerts when backend is down
  - source_match:
      alertname: "BackendDown"
    target_match_re:
      alertname: "(HighCeleryTaskFailureRate|CeleryTasksNotCompleting)"
    equal: ["instance"]

  # Inhibit P2 latency alerts when P1 latency is firing
  - source_match:
      alertname: "HighHTTPLatencyP95"
    target_match:
      alertname: "ElevatedHTTPLatencyP95"
    equal: ["instance"]
