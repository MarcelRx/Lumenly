global:
  resolve_timeout: 5m

# Route configuration - how alerts are routed to receivers
route:
  group_by: ["alertname", "severity", "team"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: "default"

  routes:
    # P0 Critical alerts - immediate notification
    - match:
        severity: P0
      receiver: "critical"
      group_wait: 0s
      repeat_interval: 5m

    # P1 High alerts - immediate notification
    - match:
        severity: P1
      receiver: "high-priority"
      group_wait: 30s
      repeat_interval: 15m

    # P2 Warning alerts - delayed notification
    - match:
        severity: P2
      receiver: "warning"
      group_wait: 5m
      repeat_interval: 1h

    # P3 Informational alerts - daily digest
    - match:
        severity: P3
      receiver: "informational"
      group_wait: 10m
      repeat_interval: 24h

    # Security alerts - immediate notification
    - match:
        team: security
      receiver: "security"
      group_wait: 0s
      repeat_interval: 10m

# Receivers - where notifications are sent
receivers:
