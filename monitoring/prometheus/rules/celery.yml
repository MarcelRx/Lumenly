groups:
  - name: celery_health
    interval: 30s
    rules:
      # High Celery Task Failure Rate - P1 HIGH
      - alert: HighCeleryTaskFailureRate
        expr: |
          (
            sum(rate(celery_task_failures_total[5m])) by (instance)
            /
            sum(rate(celery_tasks_total[5m])) by (instance)
          ) > 0.1
        for: 5m
        labels:
          severity: P1
          team: backend
        annotations:
          summary: "High Celery task failure rate"
          description: "Celery task failure rate is above 10% for more than 5 minutes."
          runbook: "docs/runbooks/celery-failures.md"

      # High Celery Task Retry Rate - P2 WARNING
      - alert: HighCeleryTaskRetryRate
        expr: rate(celery_task_retries_total[5m]) > 20
        for: 5m
        labels:
          severity: P2
          team: backend
        annotations:
          summary: "High Celery task retry rate"
          description: "Celery task retry rate is above 20 per minute for more than 5 minutes."
          runbook: "docs/runbooks/celery-failures.md"

      # Celery Tasks Not Completing - P1 HIGH
      - alert: CeleryTasksNotCompleting
        expr: rate(celery_tasks_total{status="completed"}[5m]) == 0
        for: 10m
        labels:
          severity: P1
          team: backend
        annotations:
          summary: "Celery tasks not completing"
          description: "No Celery tasks have completed in the last 10 minutes."
          runbook: "docs/runbooks/celery-failures.md"

      # High Celery Task Duration - P2 WARNING
      - alert: HighCeleryTaskDuration
        expr: |
          histogram_quantile(0.95,
            sum(rate(celery_task_duration_seconds_bucket[5m])) by (le, task)
          ) > 300
        for: 10m
        labels:
          severity: P2
          team: backend
        annotations:
          summary: "High Celery task duration"
          description: "Celery task P95 duration is above 5 minutes for more than 10 minutes."
          runbook: "docs/runbooks/celery-failures.md"

      # Elevated Celery Task Duration - P3 INFORMATIONAL
      - alert: ElevatedCeleryTaskDuration
        expr: |
          histogram_quantile(0.95,
            sum(rate(celery_task_duration_seconds_bucket[5m])) by (le, task)
          ) > 120
        for: 15m
        labels:
          severity: P3
          team: backend
        annotations:
          summary: "Elevated Celery task duration"
          description: "Celery task P95 duration is above 2 minutes for more than 15 minutes."
          runbook: "docs/runbooks/celery-failures.md"

      # No Celery Task Activity - P2 WARNING
      - alert: NoCeleryTaskActivity
        expr: rate(celery_tasks_total[5m]) == 0
        for: 15m
        labels:
          severity: P2
          team: backend
        annotations:
          summary: "No Celery task activity"
          description: "No Celery tasks have been executed in the last 15 minutes."
          runbook: "docs/runbooks/celery-failures.md"
